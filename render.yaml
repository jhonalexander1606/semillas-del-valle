# Despliegue en Render (plan gratis): backend Django + frontend React.
# La base de datos MySQL está en Azure Database for MySQL (Azure for Students, 12 meses gratis).
# La contraseña de la base se escribe en el panel de Render, nunca en este archivo.
services:
  - type: web
    name: semillas-del-valle-api
    runtime: python
    plan: free
    # Cerca de la base en Azure (Spain Central): menos latencia en cada consulta.
    region: frankfurt
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: TIME_ZONE
        value: America/Bogota
      - key: DB_ENGINE
        value: mysql
      - key: DB_HOST
        value: semillas-del-valle-db.mysql.database.azure.com
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: semillero
      - key: DB_USER
        value: semillasadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        value: https://semillas-del-valle.onrender.com
      - key: API_INTEGRACION_TOKEN
        generateValue: true
      - key: CARGAR_DATOS_DEMO
        value: "True"

  - type: web
    name: semillas-del-valle
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # React maneja las rutas (/cliente, /admin/...): todas sirven index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://semillas-del-valle-api.onrender.com
